    url: "jdbc:mysql://localhost:3306/happy_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true"
    username: "root"
