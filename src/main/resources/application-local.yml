spring:
  datasource:
    url: "jdbc:mysql://localhost:3306/happy_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul"
    username: root         # ← 로컬 DB 사용자
    password:    # ← 로컬 DB 비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 600000       # 10분
      connection-timeout: 30000  # 30초
